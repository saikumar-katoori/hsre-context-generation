<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc">
  <title id="title">Implemented HSRE project pipeline</title>
  <desc id="desc">Evidence-backed diagram of the checked-in application, distinguishing model adapters and fallbacks from inactive planned components.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#425466"/></marker>
    <style>
      .bg{fill:#f7f7f3}.title{font:700 28px Georgia,serif;fill:#172b4d}.sub{font:16px Arial,sans-serif;fill:#425466}
      .node{stroke-width:2;rx:12}.active{fill:#e6f2ee;stroke:#32735e}.adapter{fill:#e8eef8;stroke:#5576a8}.planned{fill:#fff2d8;stroke:#b47b21;stroke-dasharray:8 6}.result{fill:#fbe9e6;stroke:#b64b43}
      .label{font:700 18px Arial,sans-serif;fill:#172b4d}.small{font:14px Arial,sans-serif;fill:#334155}.tiny{font:13px Arial,sans-serif;fill:#475569}.wire{stroke:#425466;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .tag{font:700 12px Arial,sans-serif;letter-spacing:.8px}.foot{font:14px Arial,sans-serif;fill:#334155}
    </style>
  </defs>
  <rect class="bg" width="1440" height="850"/>
  <text class="title" x="54" y="54">HSRE pipeline: checked-in implementation</text>
  <text class="sub" x="54" y="83">As verified in this repository; not the paper's proposed / fully evaluated target system</text>

  <rect class="node adapter" x="460" y="115" width="520" height="74"/>
  <text class="label" x="720" y="145" text-anchor="middle">React + Vite client</text>
  <text class="small" x="720" y="170" text-anchor="middle">Audio-file upload UI; copyable prompt handoff, no microphone capture UI</text>
  <path class="wire" d="M720 189 V225"/>
  <rect class="node active" x="460" y="230" width="520" height="78"/>
  <text class="label" x="720" y="261" text-anchor="middle">FastAPI · POST /api/analyze/stream</text>
  <text class="small" x="720" y="286" text-anchor="middle">Progress events; analysis stages execute sequentially</text>
  <path class="wire" d="M720 308 V344"/>
  <rect class="node active" x="460" y="349" width="520" height="86"/>
  <text class="label" x="720" y="381" text-anchor="middle">Audio preprocessing</text>
  <text class="small" x="720" y="407" text-anchor="middle">Librosa mono / 16 kHz normalization when available; no Silero VAD call</text>

  <path class="wire" d="M720 435 V470 H245 V503"/>
  <path class="wire" d="M720 470 H585 V503"/>
  <path class="wire" d="M720 470 H950 V503"/>

  <rect class="node adapter" x="65" y="508" width="360" height="112"/>
  <text class="tag" x="245" y="532" text-anchor="middle" fill="#5576a8">MODEL ADAPTER + FALLBACK</text>
  <text class="label" x="245" y="560" text-anchor="middle">Speech-to-text</text>
  <text class="small" x="245" y="586" text-anchor="middle">Whisper Small; filename fallback if unavailable</text>
  <text class="tiny" x="245" y="607" text-anchor="middle">Pipeline constructed in request path</text>

  <rect class="node adapter" x="445" y="508" width="280" height="112"/>
  <text class="tag" x="585" y="532" text-anchor="middle" fill="#5576a8">MODEL ADAPTER</text>
  <text class="label" x="585" y="560" text-anchor="middle">HuBERT Base</text>
  <text class="small" x="585" y="586" text-anchor="middle">Mean-pooled embedding when available</text>
  <text class="tiny" x="585" y="607" text-anchor="middle">Not a trained emotion head</text>

  <rect class="node adapter" x="745" y="508" width="410" height="112"/>
  <text class="tag" x="950" y="532" text-anchor="middle" fill="#5576a8">SEPARATE CHECKPOINT + FALLBACK</text>
  <text class="label" x="950" y="560" text-anchor="middle">Emotion inference</text>
  <text class="small" x="950" y="586" text-anchor="middle">Configured wav2vec2 XLSR classifier; transcript/audio heuristic fallback</text>
  <text class="tiny" x="950" y="607" text-anchor="middle">Model not fine-tuned in this repository</text>

  <rect class="node planned" x="1175" y="508" width="220" height="112"/>
  <text class="tag" x="1285" y="532" text-anchor="middle" fill="#9a6514">RULE-BASED</text>
  <text class="label" x="1285" y="560" text-anchor="middle">Intent</text>
  <text class="small" x="1285" y="586" text-anchor="middle">Transcript keyword rules</text>
  <text class="tiny" x="1285" y="607" text-anchor="middle">BGE-M3 not loaded</text>

  <path class="wire" d="M245 620 V650 H720"/>
  <path class="wire" d="M585 620 V650"/>
  <path class="wire" d="M950 620 V650 H720"/>
  <path class="wire" d="M1285 620 V650 H720"/>
  <path class="wire" d="M720 650 V675"/>
  <rect class="node active" x="430" y="680" width="580" height="84"/>
  <text class="label" x="720" y="712" text-anchor="middle">HSRE fusion → rules + weighted heuristic → HSR</text>
  <text class="small" x="720" y="739" text-anchor="middle">Per-request history is empty; scores are engineered, not calibrated probabilities</text>
  <path class="wire" d="M720 764 V795"/>
  <text class="small" x="720" y="824" text-anchor="middle">JSON result → browser; prompt text is assembled client-side, no LLM inference</text>

  <rect x="62" y="687" width="300" height="62" rx="8" fill="#fff2d8" stroke="#b47b21" stroke-width="2" stroke-dasharray="8 6"/>
  <text class="tag" x="82" y="711" fill="#9a6514">CONFIGURED, NOT ACTIVE</text>
  <text class="small" x="82" y="735">Silero VAD · BGE-M3 semantics</text>
  <rect x="1078" y="687" width="300" height="62" rx="8" fill="#fbe9e6" stroke="#b64b43" stroke-width="2"/>
  <text class="tag" x="1098" y="711" fill="#a83c35">DATA RETENTION CAVEAT</text>
  <text class="small" x="1098" y="735">Uploads / normalized WAVs remain in tmp_audio</text>
</svg>